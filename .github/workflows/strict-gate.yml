name: strict-gate

# Scheduled constellation-wide gate: re-derives every project's status from
# its COMMITTED evidence on a cadence, so stale or failed evidence fails
# loudly even when nothing has been pushed to the factory. The push-time
# gate (self-test.yml) covers the moment code lands; this covers the days in
# between — if a project's code moved past its last gate run (git_head
# mismatch), the recorded proof no longer matches HEAD and this job goes red
# until someone re-runs that project's gate and commits fresh evidence.
#
# Why this is honest (not a permanently-green ritual): factory_gate.json now
# records VERIFICATION.git_head — the exact code commit the gate ran against
# — and status_report compares it to the repo's current code HEAD. That works
# from a fresh checkout, where the mtime-based STALE checks are inert (all
# file mtimes are checkout time). A git_head mismatch IS staleness, and it is
# detectable here. (One pathspec limitation: a single commit touching BOTH
# code and evidence is excluded on both sides and evades the hash check —
# the mtime check catches it locally; CI cannot. Separate evidence commits
# are the documented practice.)
#
# OPERATING RULE (empirically proven 2026-08-10): the recorded git_head is
# the last commit NOT touching artifacts/hygiene — so ANY commit outside
# that directory (code, scripts/, .gitignore — all count as "code" per the
# pathspec) invalidates the recorded hash and flips the project STALE until
# its gate is re-run and the regenerated evidence is committed as an
# evidence-ONLY commit. Re-run gates as part of every change to a project;
# never mix code and evidence in one commit.
#
# Zero-spend: status_report.py is stdlib-only and runs `git log`/`gh run
# list` read-only. No API keys are used, required, or reachable. GH_PAT is
# needed to check out the constellation repos and to let gh (via GH_TOKEN)
# read their factory-gate run conclusions for REGRESSED. Scope note for
# whoever rotates that token: only agent-reach is PRIVATE — nexus, msb-v3,
# domain-router, skill-orchestration-os, sovereign-mcp-os and
# sovereign-outcome-engine are all public — so the PAT needs Contents:read on
# agent-reach, and reach on the public six can come from `public_repo`
# (classic) or from explicitly selecting them (fine-grained).
#
# Token lifetime (learned the hard way 2026-09-09): a present-but-DEAD secret
# is worse than an absent one. `if: ${{ env.GH_PAT != '' }}` tests presence,
# never validity, so an expired token passed the guard, ran the checkout, got
# 401, and GitHub skipped every later step. The preflight below records
# validity in a step output; the checkouts skip on a bad token and the gate
# still runs to report UNVERIFIED — the outcome this workflow always intended.

on:
  schedule:
    # Daily 14:15 UTC. The hour is load-bearing, so here is the arithmetic.
    #
    # ORDERING INVARIANT: this judge must run AFTER the evidence producers,
    # or it grades yesterday's proof and reports stale evidence that has in
    # fact already been refreshed. msb-v3's factory_gate.json is produced by
    # scripts/factory_gate_daily.sh under launchd on a LOCAL clock
    # (06:15 America/Chicago), so its UTC landing time moves with DST:
    #     06:15 CDT (Mar-Nov) = 11:15 UTC -> proof ready ~11:22 UTC
    #     06:15 CST (Nov-Mar) = 12:15 UTC -> proof ready ~12:22 UTC  <- binding
    # The gate itself takes ~6.5 min, so the proof exists by ~12:22 UTC at the
    # latest. 14:15 UTC clears that by ~1h50m.
    #
    # This cron was "15 7 * * *" (07:15 UTC) until 2026-09-17 — FOUR HOURS
    # BEFORE the producer ran — so every run graded the previous morning's
    # evidence and flagged msb-v3 STALE on any day its code had moved, even
    # though the next producer run would (and did) fix it. It was reading a
    # correct hash comparison against a needlessly old snapshot.
    #
    # RULE for any future change: clear the producer in the WORST DST offset
    # (12:15 UTC, winter), never the local-hours one. A fixed UTC cron cannot
    # track a local-clock producer, so the schedule must absorb the drift.
    # Cron syntax: minute hour day-of-month month day-of-week.
    - cron: "15 14 * * *"
  workflow_dispatch: {}  # manual trigger for on-demand verification

jobs:
  strict:
    name: strict constellation gate (committed evidence vs code HEAD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Non-fatal validity probe: never fails the run itself, just records
      # whether GH_PAT works and annotates the cause (with the expiry when
      # GitHub reports it). See the header note.
      - name: Validate GH_PAT (non-fatal — annotates the cause, gates the checkouts)
        id: pat
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT:-}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GH_PAT secret is not set — the constellation checkouts will be skipped; the gate below still runs and reports every project UNVERIFIED."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -D /tmp/pat_headers -w '%{http_code}' \
                   -H "Authorization: Bearer $GH_PAT" \
                   -H "Accept: application/vnd.github+json" \
                   https://api.github.com/user) || code=000
          exp=$(grep -i '^github-authentication-token-expiration:' /tmp/pat_headers 2>/dev/null | sed 's/^[^:]*:[[:space:]]*//; s/\r$//' || true)
          if [ -n "$exp" ]; then echo "GH_PAT expires: $exp"; else echo "GH_PAT expiry: not reported for this token type"; fi
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "GH_PAT valid (HTTP 200)"

            # VALIDITY IS NOT ACCESS. The seven checkouts below need
            # Contents:read on lordwilsonDev/agent-reach (private) plus reach
            # on the six public repos. A valid but under-scoped token passes
            # the probe above and then 403/404s at the checkouts, producing a
            # red whose UNVERIFIED verdicts look exactly like an expired
            # token's — so probe every repo by NAME, and let the annotation
            # name the FIX (grant scope) rather than sending someone to
            # rotate a token that was never dead.
            #
            # Deliberately NOT folded into `ok`: a subset failure must not
            # stop the repos that DO resolve from being checked out, or one
            # missing scope would downgrade all seven verdicts to UNVERIFIED
            # instead of six true readings and one attributed gap.
            UNREACHABLE=""
            for r in msb-v3 agent-reach sovereign-mcp-os sovereign-outcome-engine nexus domain-router skill-orchestration-os; do
              rc=$(curl -sS -o /dev/null -w '%{http_code}' \
                     -H "Authorization: Bearer $GH_PAT" \
                     -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/lordwilsonDev/$r") || rc=000
              if [ "$rc" = "200" ]; then
                printf '  %-24s reachable (HTTP 200)\n' "$r"
              else
                printf '  %-24s UNREACHABLE (HTTP %s)\n' "$r" "$rc"
                UNREACHABLE="$UNREACHABLE $r"
              fi
            done
            UNREACHABLE="${UNREACHABLE# }"
            echo "unreachable=$UNREACHABLE" >> "$GITHUB_OUTPUT"
            if [ -n "$UNREACHABLE" ]; then
              echo "::error::GH_PAT is valid but cannot read: $UNREACHABLE. Grant that token Contents:Read on each of those repos (agent-reach is private, so it must be selected explicitly). They cannot be checked out, so their verdicts below read UNVERIFIED — a SCOPE artifact, not a project regression."
            fi
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "unreachable=" >> "$GITHUB_OUTPUT"
            echo "::error::GH_PAT rejected (HTTP $code) — the token is expired or revoked. Rotate it (Contents:read on agent-reach plus the six public constellation repos) and run 'gh secret set GH_PAT'."
          fi

      - name: Checkout msb-v3
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/msb-v3
          token: ${{ secrets.GH_PAT }}
          path: msb-v3
          # fetch-depth: 0 is LOAD-BEARING, not a nicety: the gate records
          # the last NON-EVIDENCE commit hash, and the evidence commits ARE
          # the repo tips. A shallow (default depth-1) clone has no parent to
          # walk to past the tip, so code_head() returns None, the hash
          # staleness check silently no-ops, and this gate would be a
          # permanently-green ritual. Full history is required for the
          # comparison to actually run.
          fetch-depth: 0

      - name: Checkout agent-reach
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/agent-reach
          token: ${{ secrets.GH_PAT }}
          path: agent-reach
          fetch-depth: 0

      - name: Checkout sovereign-mcp-os
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/sovereign-mcp-os
          token: ${{ secrets.GH_PAT }}
          path: sovereign-mcp-os
          fetch-depth: 0

      - name: Checkout sovereign-outcome-engine
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/sovereign-outcome-engine
          token: ${{ secrets.GH_PAT }}
          path: sovereign-outcome-engine
          fetch-depth: 0

      - name: Checkout nexus
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/nexus
          token: ${{ secrets.GH_PAT }}
          path: nexus
          fetch-depth: 0

      - name: Checkout domain-router
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/domain-router
          token: ${{ secrets.GH_PAT }}
          path: domain-router
          fetch-depth: 0

      - name: Checkout skill-orchestration-os
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/skill-orchestration-os
          token: ${{ secrets.GH_PAT }}
          path: skill-orchestration-os
          fetch-depth: 0

      # The gate itself: any evaluated project below VERIFIED (FAILING,
      # REGRESSED, CONTESTED, UNVERIFIED, STALE) fails the run — which fails
      # loudly on a schedule via the Actions UI, the run list, and any
      # configured notifications. Deliberately NOT guarded on GH_PAT: if the
      # checkouts above were skipped (missing/rotated secret), the repos are
      # absent here, every project reads UNVERIFIED, and strict exits 1 — a
      # missing PAT becomes an ops-visible red instead of a silent skip. All
      # seven constellation repos carry committed gate evidence. `--with-ci`
      # makes REGRESSED derivable: gh reads each repo's last factory-gate run
      # conclusion via GH_TOKEN (= GH_PAT for cross-repo access); a failure on
      # fresh PASS evidence flips the project REGRESSED (historical green +
      # current red). The --only list must track PROJECTS in
      # scripts/status_report.py — the canonical registry.
      - name: Strict constellation gate (daily — stale/regressed evidence fails loudly)
        if: ${{ !cancelled() }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MSB_STATUS_HOME: ${{ github.workspace }}
        run: |
          # Attribution guard: the UNVERIFIED verdict below is MEANT to be
          # reachable from a missing token, but it must not be misread as
          # seven projects regressing. Say which it is, every run — and note
          # that a dead token and an under-scoped one now print DIFFERENT
          # lines, because they need different fixes.
          if [ "${{ steps.pat.outputs.ok }}" != "true" ]; then
            echo "::error::GH_PAT was unusable, so no constellation repo could be checked out — the UNVERIFIED verdict below is a MISSING-EVIDENCE artifact of the token, not a project regression."
          elif [ -n "${{ steps.pat.outputs.unreachable }}" ]; then
            echo "::error::GH_PAT is valid but could not read: ${{ steps.pat.outputs.unreachable }} — those projects are absent from this run, so their verdicts below read UNVERIFIED. That is a SCOPE artifact of the token, not a project regression."
          fi
          python scripts/status_report.py --strict --with-ci \
            --only msb-v3,agent-reach,sovereign-mcp-os,sovereign-outcome-engine,nexus,domain-router,skill-orchestration-os
