name: self-test

# Zero-spend canary + enforcement tests for the engineering-hygiene factory.
# Runs on every push to main, on a daily schedule, and manually. Fail-fast: a
# broken scrub, a leaking `_spawn` choke point, or a regression in the
# live-auth probe env isolation must be caught the moment it lands.
#
# The canary (`run_factory.py --self-test`) is stdlib-only and needs NO
# secrets — it injects its own sentinel credentials. The enforcement tests
# need pytest. No API keys are used, required, or reachable here.

on:
  push:
    branches: [main]
  schedule:
    # Daily 13:30 UTC — deliberately after the evidence producers.
    #
    # The canary and enforcement steps would run correctly at any hour, but
    # this workflow's final step is also a freshness judge, so it obeys the
    # same ORDERING INVARIANT as strict-gate.yml (see the full derivation
    # there): msb-v3's proof is refreshed by a local 06:15 America/Chicago
    # launchd job — 12:15 UTC in the worst (winter) offset, +~6.5 min to run
    # — so 13:30 UTC clears it by over an hour. Was 06:30 UTC until
    # 2026-09-17, which judged evidence from ~20 hours earlier.
    - cron: "30 13 * * *"
  workflow_dispatch:

jobs:
  canary:
    name: zero-spend canary + enforcement tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install --upgrade pip pytest

      # Preflight: does GH_PAT actually WORK? The guards below used to be
      # `if: ${{ env.GH_PAT != '' }}` — the presence of the secret, never its
      # validity. A present-but-expired token therefore PASSED the guard, RAN
      # the checkout, got 401 ("Bad credentials"), and GitHub then skipped
      # every later step — including the ones that need no secret at all (the
      # zero-spend canary, the enforcement tests, the status canary documented
      # as ungated "with or without the GH_PAT secret"). That is how a 30-day
      # expiry went unnoticed for 8 days: the secret was last written
      # 2026-08-10T04:44Z, its expiry fell at 2026-09-09T04:44Z, and every run
      # from 2026-09-09T11:45Z onward died at the FIRST checkout. Note the
      # asymmetry: an ABSENT secret skips these steps gracefully; a DEAD one
      # detonated. This step never fails — it records validity for the steps
      # below and annotates the exact cause, so the reason is one line instead
      # of a log dig. It also prints the token's expiry when GitHub reports it
      # (fine-grained PATs do), which is how this should be spotted BEFORE it
      # bites rather than after.
      - name: Validate GH_PAT (non-fatal — reports, never blocks the secret-free checks)
        id: pat
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT:-}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GH_PAT secret is not set — the seven cross-repo checkouts will be skipped; every secret-free check below still runs."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -D /tmp/pat_headers -w '%{http_code}' \
                   -H "Authorization: Bearer $GH_PAT" \
                   -H "Accept: application/vnd.github+json" \
                   https://api.github.com/user) || code=000
          exp=$(grep -i '^github-authentication-token-expiration:' /tmp/pat_headers 2>/dev/null | sed 's/^[^:]*:[[:space:]]*//; s/\r$//' || true)
          if [ -n "$exp" ]; then echo "GH_PAT expires: $exp"; else echo "GH_PAT expiry: not reported for this token type"; fi
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "GH_PAT valid (HTTP 200)"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::GH_PAT rejected (HTTP $code) — the token is expired or revoked. Rotate it: create a token with Contents:read on agent-reach plus the six public sample repos, then 'gh secret set GH_PAT'. The cross-repo checkouts will be skipped; the secret-free checks still run and report, and this run stays RED."
          fi

      - name: Checkout domain-router (d03 sync guard + strict-gate evidence)
        if: ${{ steps.pat.outputs.ok == 'true' }}
        # continue-on-error so a flaky/dead token cannot take the secret-free
        # steps down with it (see the preflight above).
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/domain-router
          token: ${{ secrets.GH_PAT }}
          # Must live INSIDE the workspace: actions/checkout rejects paths
          # outside $GITHUB_WORKSPACE (../ was rejected on the first run).
          path: domain-router
          # fetch-depth: 0 so the strict step's git_head comparison can walk
          # past the evidence tip commit (see the msb-v3 note below).
          fetch-depth: 0

      - name: Checkout skill-orchestration-os (strict-gate evidence)
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/skill-orchestration-os
          token: ${{ secrets.GH_PAT }}
          path: skill-orchestration-os
          fetch-depth: 0

      - name: Checkout nexus (full-gate sample; needs GH_PAT secret)
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/nexus
          token: ${{ secrets.GH_PAT }}
          path: nexus
          fetch-depth: 0

      # The remaining constellation repos — checked out so the --strict step
      # can gate their committed evidence from fresh clones. Each repo's OWN
      # factory-gate workflow re-runs its real gate on every push to it; the
      # factory's strict step checks that every project's committed gate
      # evidence exists AND says PASS (all seven: msb-v3, agent-reach,
      # sovereign-mcp-os, sovereign-outcome-engine, nexus, domain-router,
      # skill-orchestration-os).
      # fetch-depth: 0 is load-bearing for the strict step's git_head
      # comparison — the evidence commits ARE the repo tips, so a shallow
      # depth-1 clone has no parent to walk to and code_head() would return
      # None, silently disabling the hash staleness check.
      - name: Checkout msb-v3 (strict-gate evidence)
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/msb-v3
          token: ${{ secrets.GH_PAT }}
          path: msb-v3
          fetch-depth: 0

      - name: Checkout agent-reach (strict-gate evidence)
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/agent-reach
          token: ${{ secrets.GH_PAT }}
          path: agent-reach
          fetch-depth: 0

      - name: Checkout sovereign-mcp-os (strict-gate evidence)
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/sovereign-mcp-os
          token: ${{ secrets.GH_PAT }}
          path: sovereign-mcp-os
          fetch-depth: 0

      - name: Checkout sovereign-outcome-engine (strict-gate evidence)
        if: ${{ steps.pat.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/sovereign-outcome-engine
          token: ${{ secrets.GH_PAT }}
          path: sovereign-outcome-engine
          fetch-depth: 0

      # The next two steps need NO secret. `!cancelled()` (not `always()`) is
      # the correct "run even if a step above failed" form: it still stops a
      # cancelled run. These two are the point of the whole hardening — they
      # are stdlib-only / sibling-tolerant by design, so a token problem must
      # never be able to suppress them.
      - name: run_factory.py --self-test (three env boundaries)
        if: ${{ !cancelled() }}
        run: python scripts/run_factory.py --self-test

      # Needs no secret. The d03/d05/d07 halves read sibling runners from
      # domain-router; tests/test_d03_sync.py SKIPS with an explicit reason
      # when the sibling checkout is absent, so running this without the
      # cross-repo checkouts degrades to a visible skip rather than a
      # confusing failure.
      - name: Enforcement tests + d03 scrub-list sync guard
        if: ${{ !cancelled() }}
        env:
          D03_RUNNER_PATH: ${{ github.workspace }}/domain-router/scripts/hygiene/d03_orchestration_smoke_runner.py
        run: python -m pytest tests/ -q

      # Whole-loop proof: run the REAL gate end-to-end against a sample
      # project (nexus: 4 pytest tests + n01-n03 hygiene suite, live_auth
      # scoped out — no server needed). This exercises run_pytest,
      # run_suite, _extract_json_object, build_gate and the gate JSON write
      # exactly as production uses them, on every push.
      # Genuinely PAT-dependent: without the nexus checkout this can only
      # throw file-not-found, so it SKIPS when the token is unusable rather
      # than producing a useless red. The final report step keeps that skip
      # loud instead of silent.
      - name: Full factory gate on nexus (whole loop end-to-end)
        if: ${{ !cancelled() && steps.pat.outputs.ok == 'true' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MSB_REPO: ${{ github.workspace }}/nexus
          MSB_PYTHON: python
        run: |
          pip install -q pytest pytest-cov fastapi uvicorn rich prompt-toolkit pyyaml ollama
          python scripts/run_factory.py --project "${{ github.workspace }}/nexus"
          # Two assertions, same pass/fail, better diagnostics: PASS now
          # REQUIRES regression_passed, so a red nexus suite surfaces as
          # "regression_passed=False" rather than a bare "full gate not PASS".
          python -c "import json; g=json.load(open('${{ github.workspace }}/nexus/artifacts/hygiene/factory_gate.json'))['RELEASE_VERDICT']; print('gate:', g['release_verdict'], '| regression:', g['regression_passed'], '| violations:', g['artifact_schema_violations'], '| unknowns:', len(g['unresolved_unknowns'])); assert g['regression_passed'] is True, 'nexus pytest suite did not pass in-factory — a red suite must never publish PASS (verdict=%s)' % g['release_verdict']; assert g['release_verdict']=='PASS', 'full gate not PASS'"

      # Meta-move canary: status is DERIVED from evidence, never asserted.
      # Needs no secret and no sibling checkout. `!cancelled()` makes the
      # "with or without the GH_PAT secret" promise below TRUE again — it was
      # false from 2026-09-09 onward, when a dead token failed the first
      # checkout and took every later step with it.
      - name: Status canary (derive, don't assert)
        if: ${{ !cancelled() }}
        run: |
          python scripts/status_report.py --check
          python -c "import json; d=json.load(open('artifacts/status/status.json')); assert d['projects'], 'status.json must list projects'; print('status.json OK — aggregate:', d['verdict'])"

      # Meta-move gate: status is DERIVED from evidence, never asserted.
      # --strict exits 1 if ANY evaluated project is below VERIFIED (FAILING,
      # REGRESSED, CONTESTED, UNVERIFIED, STALE) — so a project whose
      # committed gate evidence went missing, flipped to FAILED, drifted from
      # its code HEAD, or is contradicted by a red CI run fails this push.
      # Scoped via --only to the seven repos checked out above (list must
      # track PROJECTS in scripts/status_report.py — the canonical registry).
      # `--with-ci` enables REGRESSED derivation: gh reads each repo's last
      # factory-gate run conclusion via GH_TOKEN (= GH_PAT for cross-repo
      # access); a failure on fresh PASS evidence flips the project REGRESSED.
      #
      # NOTE — what strict CAN and CANNOT prove in CI: a fresh checkout sets
      # every file's mtime to checkout time, so the mtime STALE checks are
      # inert here. But the gate records VERIFICATION.git_head (the commit it
      # ran against), and strict compares it to the repo's current code HEAD
      # — a mismatch IS staleness and IS detected from a fresh checkout. The
      # age window (evidence older than N days) remains a local-run property;
      # the scheduled strict-gate.yml workflow re-derives this same gate
      # daily so drift fails loudly even without a push.
      # Deliberately NOT guarded on GH_PAT (same reasoning as strict-gate.yml):
      # with the repos absent every project reads UNVERIFIED and strict exits
      # 1, so a token problem stays an ops-visible red instead of a silent
      # skip. The one thing that had to change is ATTRIBUTION — that red
      # otherwise reads as "seven projects regressed" when the truth is
      # "seven repos were never checked out". The guard line below says which.
      - name: Strict constellation gate (UNVERIFIED/FAILING/STALE/REGRESSED/CONTESTED fails)
        if: ${{ !cancelled() }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MSB_STATUS_HOME: ${{ github.workspace }}
        run: |
          if [ "${{ steps.pat.outputs.ok }}" != "true" ]; then
            echo "::error::GH_PAT was unusable, so no constellation repo could be checked out — the UNVERIFIED verdict below is a MISSING-EVIDENCE artifact of the token, not a project regression."
          fi
          python scripts/status_report.py --strict --with-ci \
            --only msb-v3,agent-reach,sovereign-mcp-os,sovereign-outcome-engine,nexus,domain-router,skill-orchestration-os

      # Degradation is loud but LATE: a dead or absent GH_PAT still fails the
      # run (a green run over skipped gates is exactly the false-green this
      # repo exists to prevent), but only after every secret-free check has
      # already executed and reported. Before this change the same situation
      # produced a red for 8 days that nobody could attribute without digging
      # through checkout logs.
      - name: Report degraded cross-repo coverage
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ steps.pat.outputs.ok }}" != "true" ]; then
            echo "::error::GH_PAT was unusable, so the seven cross-repo checks did not run. Rotate the token and re-run — see the 'Validate GH_PAT' step for the HTTP status and expiry."
            exit 1
          fi
          echo "GH_PAT usable — full cross-repo coverage ran."
