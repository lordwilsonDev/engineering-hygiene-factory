name: self-test

# Zero-spend canary + enforcement tests for the engineering-hygiene factory.
# Runs on every push to main, on a daily schedule, and manually. Fail-fast: a
# broken scrub, a leaking `_spawn` choke point, or a regression in the
# live-auth probe env isolation must be caught the moment it lands.
#
# The canary (`run_factory.py --self-test`) is stdlib-only and needs NO
# secrets — it injects its own sentinel credentials. The enforcement tests
# need pytest. No API keys are used, required, or reachable here.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"   # daily 06:30 UTC
  workflow_dispatch:

jobs:
  canary:
    name: zero-spend canary + enforcement tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install --upgrade pip pytest

      - name: Checkout domain-router (d03 sync guard; needs GH_PAT secret)
        if: ${{ env.GH_PAT != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/domain-router
          token: ${{ secrets.GH_PAT }}
          # Must live INSIDE the workspace: actions/checkout rejects paths
          # outside $GITHUB_WORKSPACE (../ was rejected on the first run).
          path: domain-router

      - name: Checkout nexus (full-gate sample; needs GH_PAT secret)
        if: ${{ env.GH_PAT != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/nexus
          token: ${{ secrets.GH_PAT }}
          path: nexus
          fetch-depth: 0

      # The four remaining constellation repos — checked out so the --strict
      # step can gate their committed evidence from fresh clones. Each repo's
      # OWN factory-gate workflow re-runs its real gate on every push to it;
      # the factory's strict step checks that every project's committed gate
      # evidence exists AND says PASS (all five: msb-v3, agent-reach,
      # sovereign-mcp-os, sovereign-outcome-engine, nexus).
      # fetch-depth: 0 is load-bearing for the strict step's git_head
      # comparison — the evidence commits ARE the repo tips, so a shallow
      # depth-1 clone has no parent to walk to and code_head() would return
      # None, silently disabling the hash staleness check.
      - name: Checkout msb-v3 (strict-gate evidence)
        if: ${{ env.GH_PAT != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/msb-v3
          token: ${{ secrets.GH_PAT }}
          path: msb-v3
          fetch-depth: 0

      - name: Checkout agent-reach (strict-gate evidence)
        if: ${{ env.GH_PAT != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/agent-reach
          token: ${{ secrets.GH_PAT }}
          path: agent-reach
          fetch-depth: 0

      - name: Checkout sovereign-mcp-os (strict-gate evidence)
        if: ${{ env.GH_PAT != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/sovereign-mcp-os
          token: ${{ secrets.GH_PAT }}
          path: sovereign-mcp-os
          fetch-depth: 0

      - name: Checkout sovereign-outcome-engine (strict-gate evidence)
        if: ${{ env.GH_PAT != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        uses: actions/checkout@v4
        with:
          repository: lordwilsonDev/sovereign-outcome-engine
          token: ${{ secrets.GH_PAT }}
          path: sovereign-outcome-engine
          fetch-depth: 0

      - name: run_factory.py --self-test (three env boundaries)
        run: python scripts/run_factory.py --self-test

      - name: Enforcement tests + d03 scrub-list sync guard
        env:
          D03_RUNNER_PATH: ${{ github.workspace }}/domain-router/scripts/hygiene/d03_orchestration_smoke_runner.py
        run: python -m pytest tests/ -q

      # Whole-loop proof: run the REAL gate end-to-end against a sample
      # project (nexus: 4 pytest tests + n01-n03 hygiene suite, live_auth
      # scoped out — no server needed). This exercises run_pytest,
      # run_suite, _extract_json_object, build_gate and the gate JSON write
      # exactly as production uses them, on every push.
      - name: Full factory gate on nexus (whole loop end-to-end)
        if: ${{ env.GH_PAT != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MSB_REPO: ${{ github.workspace }}/nexus
          MSB_PYTHON: python
        run: |
          pip install -q pytest pytest-cov fastapi uvicorn rich prompt-toolkit pyyaml ollama
          python scripts/run_factory.py --project "${{ github.workspace }}/nexus"
          python -c "import json; g=json.load(open('${{ github.workspace }}/nexus/artifacts/hygiene/factory_gate.json'))['RELEASE_VERDICT']; print('gate:', g['release_verdict'], '| regression:', g['regression_passed'], '| violations:', g['artifact_schema_violations'], '| unknowns:', len(g['unresolved_unknowns'])); assert g['release_verdict']=='PASS', 'full gate not PASS'"

      # Meta-move canary: status is DERIVED from evidence, never asserted.
      # Ungated on purpose — this proves the generator emits a well-formed
      # status.json on EVERY push, with or without the GH_PAT secret.
      - name: Status canary (derive, don't assert)
        run: |
          python scripts/status_report.py --check
          python -c "import json; d=json.load(open('artifacts/status/status.json')); assert d['projects'], 'status.json must list projects'; print('status.json OK — aggregate:', d['verdict'])"

      # Meta-move gate: status is DERIVED from evidence, never asserted.
      # --strict exits 1 if ANY evaluated project is below VERIFIED (FAILING/
      # UNVERIFIED/STALE) — so a project whose committed gate evidence went
      # missing, flipped to FAILED, or drifted from its code HEAD fails this
      # push. Scoped via --only to the five repos checked out above (list must
      # track PROJECTS in scripts/status_report.py — the canonical registry);
      # domain-router and skill-orchestration-os are excluded because their
      # evidence is not committed (both are enforced by their own workflows:
      # domain-router's routing-gate, skill-os's smoke suite). MSB_STATUS_HOME
      # rebases the constellation onto the checkout workspace.
      #
      # NOTE — what strict CAN and CANNOT prove in CI: a fresh checkout sets
      # every file's mtime to checkout time, so the mtime STALE checks are
      # inert here. But the gate records VERIFICATION.git_head (the commit it
      # ran against), and strict compares it to the repo's current code HEAD
      # — a mismatch IS staleness and IS detected from a fresh checkout. The
      # age window (evidence older than N days) remains a local-run property;
      # the scheduled strict-gate.yml workflow re-derives this same gate
      # daily so drift fails loudly even without a push.
      - name: Strict constellation gate (UNVERIFIED/FAILING/STALE-by-hash fails)
        if: ${{ env.GH_PAT != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MSB_STATUS_HOME: ${{ github.workspace }}
        run: |
          python scripts/status_report.py --strict \
            --only msb-v3,agent-reach,sovereign-mcp-os,sovereign-outcome-engine,nexus
