[mutmut]
# Scratch-dir config for mutating the verifier itself.
#
# WHY a scratch dir: mutmut 3.7 derives mutant keys from the source FILE PATH
# (scripts/run_factory.py -> key "scripts.run_factory.x__fn"), but the tests
# import the flat module name (run_factory) which the trampoline records as
# "run_factory.x__fn". The two never match, so mutmut aborts with
# "trampoline hits but none match any mutant key". Fix per mutmut's own
# guidance: give the walked files NO directory prefix — here the symlinked
# run_factory.py / status_report.py at this dir's top level. Mutation happens
# on the real files through the symlinks (copy2/open dereference them).
source_paths =
    run_factory.py
    status_report.py
pytest_add_cli_args_test_selection = tests/
# Non-mutated deps needed inside the mutants/ tree. `scripts` carries the real
# schema_validate.py + validate_artifacts.py (the tests/conftest appends
# <mutants>/scripts to sys.path); skills/epistemic-hygiene is resolved by
# test_epistemic_modules relative to __file__.
also_copy =
    schema_validate.py
    scripts
    skills/epistemic-hygiene
# No .git in the scratch dir — disable change detection (pure hash caching).
use_git_change_detection = false
# ⚠️ HAZARD: the source files here are SYMLINKS to ../scripts/*.py. `mutmut
# run`/`show`/`results` only write under mutants/ — safe. NEVER run `mutmut
# apply` (or anything that writes into the source path) from this dir: it
# would mutate the REAL scripts/run_factory.py and scripts/status_report.py.
