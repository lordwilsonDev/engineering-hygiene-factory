# NOTE: the mutmut config for this repo lives in .mutmut-scratch/setup.cfg
# (run from there: `cd .mutmut-scratch && python -m mutmut run`). The root
# setup.cfg deliberately has NO [mutmut] section — a root invocation fails
# with mutmut 3.7's trampoline key mismatch (flat imports vs scripts/ paths).

[flake8]
max-line-length = 100
