[mutmut]
# Mutation-test the verifier itself: run_factory.py (the gate orchestrator,
# verdict builder) and status_report.py (the status-from-evidence generator).
#
# mutmut 3.7 runs every pytest phase with cwd=mutants/ and --rootdir=.. The
# default also_copy carries tests/ + setup.cfg into the mutants tree; the
# conftest inside the copied tests/ appends the mutated scripts/ to sys.path
# so mutants shadow originals at import time. `runner` is not a mutmut 3.7
# config key (in-process PytestRunner only) — omitted on purpose.
# NOTE: mutmut's setup.cfg reader treats list values as NEWLINE-separated;
# a single line with two paths parses as ONE bogus path and nothing mutates.
source_paths =
    scripts/run_factory.py
    scripts/status_report.py
pytest_add_cli_args_test_selection = tests/
# Non-mutated deps the tests need inside the mutants/ tree: run_factory imports
# schema_validate, and test_epistemic_modules resolves its module dir relative
# to __file__ (i.e. mutants/skills/epistemic-hygiene under a mutation run).
also_copy =
    scripts/schema_validate.py
    skills/epistemic-hygiene

[flake8]
max-line-length = 100
